<body>
    <time-ticker id="timeTicker" duration=4000 items='[
        "Neo,",
        "sooner or later",
        "you`re going to realize",
        "just as I did",
        "that there`s a difference",
        "between knowing the path",
        "and walking the path"
    ]'>
    </time-ticker>
    <script>
        setTimeout(() => {
            console.log('adding event listener');
            timeTicker.timeTicker.addEventListener('tick', e => {
                console.log({e});
            })
        }, 2000);
    </script>
    <on-to-me on=value-changed to=[-text] me=1 vft=item val=target.item></on-to-me>
    <co-depends-text-scramble -text class="text"></co-depends-text-scramble>
    <style>
        @import 'https://fonts.googleapis.com/css?family=Roboto+Mono:100';
        html,  
        div.body {
        font-family: 'Roboto Mono', monospace;
        background: #212121;
        height: 100%;
        }
        .container {
            height: 100%;
            width: 100%;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .text {
            font-weight: 100;
            font-size: 28px;
            color: #fafafa;
        }
        .dud {
            color: #757575;
        }
    </style>
